---
pod_spelling_system:
  skip: 0
  # list of words that are spelled correctly
  # (regardless of what spell check thinks)
  # or stuff that I like to spell incorrectly
  # intentionally
  stopwords:
    - OpenAPI
    - KiB
    - MiB
    - macOS
    - validator
    - Mojo
    - MOJOLICIOUS

pod_coverage:
  skip: 0
  # format is "Class#method" or "Class",regex allowed
  # for either Class or method.
  private:
    - OpenAPI::Humbug.*#BUILD
    - OpenAPI::Humbug.*#DEMOLISH
    - OpenAPI::Humbug::Transport::Command#(ends_with_shutdown|stderr)
